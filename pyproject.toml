[tool.poetry]
name = "gaayo-api"
version = "0.1.0"
description = "API for karaoke-based audio processing"
authors = ["Sumit Luitel <sumitluitel42@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = ">=0.111"
uvicorn = { extras = ["standard"], version = ">=0.29" }
pydantic-settings = "^2.14.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
httpx = ">=0.27"
ruff = ">=0.4"

[tool.ruff]
line-length = 88
target-version = "py311"